name: Deploy - Page commune + jeux

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci-two-ships:
    name: CI - Two Ships
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: two-ships-passing-in-the-night

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: two-ships-passing-in-the-night/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: |
          set +e
          npm audit
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit a détecté des vulnérabilités (Two Ships)."
          fi
          exit 0

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Functional tests
        run: npm run test:e2e

  ci-space-invaders:
    name: CI - Space Invaders
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: |
          set +e
          npm audit --audit-level=moderate
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit a détecté des vulnérabilités (Space Invaders)."
          fi
          exit 0

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Functional tests
        run: npx playwright test

  build:
    name: Build tous les projets
    needs: [ci-two-ships, ci-space-invaders]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Two Ships ---
      - name: Installer les dépendances Two Ships
        run: npm ci
        working-directory: two-ships-passing-in-the-night

      - name: Build Two Ships
        run: npx vite build --base=/${{ github.event.repository.name }}/two-ships/
        working-directory: two-ships-passing-in-the-night

      # --- Space Invaders ---
      - name: Installer les dépendances Space Invaders
        run: npm ci
        working-directory: Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90

      - name: Build Space Invaders
        run: npm run build
        working-directory: Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90

      # --- Assemblage ---
      - name: Assembler le site complet
        run: |
          mkdir -p _site/two-ships _site/space-invaders
          cp web/index.html _site/index.html
          cp -r two-ships-passing-in-the-night/dist/. _site/two-ships/
          cp -r Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90/build/. _site/space-invaders/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Déploiement GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Résumé du déploiement
        if: always()
        run: |
          {
            echo "## Déploiement global";
            echo "";
            echo "- Branche: ${{ github.ref_name }}";
            echo "- Commit: ${{ github.sha }}";
            echo "- Statut: ${{ steps.deployment.outcome }}";
            echo "- URL: ${{ steps.deployment.outputs.page_url }}";
          } >> "$GITHUB_STEP_SUMMARY"
