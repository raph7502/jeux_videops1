name: CI - Two Ships Passing In The Night

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: two-ships-passing-in-the-night

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: two-ships-passing-in-the-night/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm audit)
        id: audit
        run: |
          set +e
          npm audit
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit a détecté des vulnérabilités (code=$status). Consulte le log ci-dessus."
            echo "AUDIT_STATUS=failed" >> "$GITHUB_ENV"
          else
            echo "AUDIT_STATUS=passed" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Linter (Google Style Guide)
        id: lint
        run: |
          set +e
          npm run lint:check
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Le linter a échoué. Corrige les erreurs ESLint (Google JS Style Guide)."
            exit "$status"
          fi

      - name: Unit tests (Jest)
        id: tests
        run: |
          set +e
          npm test
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Les tests unitaires ont échoué. Vérifie la sortie Jest."
            exit "$status"
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Functional tests (Playwright)
        id: e2e
        run: |
          set +e
          npm run test:e2e
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Les tests fonctionnels ont échoué. Vérifie la sortie Playwright."
            exit "$status"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: two-ships-passing-in-the-night/playwright-report/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Résumé CI";
            echo "";
            echo "- Projet: two-ships-passing-in-the-night";
            echo "- Node: 20 (ubuntu-latest)";
            echo "- Audit (non bloquant): ${AUDIT_STATUS:-unknown}";
            echo "- Lint: ${{ steps.lint.outcome }}";
            echo "- Tests unitaires: ${{ steps.tests.outcome }}";
            echo "- Tests fonctionnels: ${{ steps.e2e.outcome }}";
          } >> "$GITHUB_STEP_SUMMARY"
