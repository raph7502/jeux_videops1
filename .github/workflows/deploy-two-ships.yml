name: Deploy - Two Ships Passing In The Night

on:
  push:
    branches:
      - main
    paths:
      - 'two-ships-passing-in-the-night/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: two-ships-passing-in-the-night

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: two-ships-passing-in-the-night/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: two-ships-passing-in-the-night/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Déploiement Two Ships";
            echo "";
            echo "- Branche: ${{ github.ref_name }}";
            echo "- Commit: ${{ github.sha }}";
            echo "- Statut: ${{ steps.deployment.outcome }}";
            echo "- URL: ${{ steps.deployment.outputs.page_url }}";
          } >> "$GITHUB_STEP_SUMMARY"
