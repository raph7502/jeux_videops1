name: Deploy - Space Invaders

on:
  push:
    branches:
      - main
    paths:
      - 'Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90/**'
      - '.github/workflows/deploy-space-invaders.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Space-Invaders/SpaceInvaders-e664e935fa518d7edea6a0db6d779da46edd0a90/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Déploiement Space Invaders";
            echo "";
            echo "- Branche: ${{ github.ref_name }}";
            echo "- Commit: ${{ github.sha }}";
            echo "- Statut: ${{ steps.deployment.outcome }}";
            echo "- URL: ${{ steps.deployment.outputs.page_url }}";
          } >> "$GITHUB_STEP_SUMMARY"
